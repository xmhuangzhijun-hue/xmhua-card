name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify generated files are in sync
        shell: bash
        run: |
          bash scripts/sync-agent-rules.sh
          node scripts/sync-skills.mjs

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Generated files are out of sync with their sources (AGENTS.md / SKILL.md)."
            echo "Run the sync scripts locally and commit the result:"
            echo "  bash scripts/sync-agent-rules.sh"
            echo "  node scripts/sync-skills.mjs"
            git status --short
            git diff --stat
            exit 1
          fi
          echo "All generated files are in sync with their sources."

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Lint
        run: npm run lint

      - name: Type check (frontend)
        run: npm run typecheck

      - name: Type check (API)
        run: npm run typecheck --prefix api

      - name: Security regression (frontend tooling)
        run: npm run security:check

      - name: Security regression (API)
        run: npm run security:check --prefix api

      - name: Dependency audit (frontend)
        run: npm audit --audit-level=moderate

      - name: Dependency audit (API)
        run: npm audit --audit-level=moderate --prefix api

      - name: Build API
        run: npm run build --prefix api

      # The frontend renders from the API at build time. A stub serves the
      # published content shape so the build does not need a database.
      - name: Build frontend
        run: |
          node .github/scripts/stub-content-api.mjs &
          STUB_PID=$!
          trap "kill $STUB_PID" EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:39399/api/health >/dev/null && break
            sleep 1
          done
          API_INTERNAL_BASE_URL=http://127.0.0.1:39399 npm run build
